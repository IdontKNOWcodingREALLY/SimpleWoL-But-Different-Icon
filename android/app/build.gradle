plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    // 1. Added the missing namespace to fix the compile error
    namespace "com.idontknowcodingreally.simplewolbutdifferenticon"
    
    compileSdkVersion flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.idontknowcodingreally.simplewolbutdifferenticon"
        minSdkVersion 19 
        targetSdkVersion flutter.targetSdkVersion
        // The Flutter plugin now provides these variables automatically
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    // 2. We keep the signingConfigs block but we won't use it in the release build
    // This prevents errors when the environment variables (secrets) are missing
    signingConfigs {
        release {
            storeFile file("../key.jks")
            storePassword System.getenv("KEY_PASSWORD")
            keyAlias "release"
            keyPassword System.getenv("ALIAS_PASSWORD")
        }
    }

    buildTypes {
        release {
            // This line forces the release APK to be signed so it can be installed
            signingConfig signingConfigs.debug 
            
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // The Kotlin standard library is now automatically handled by the Kotlin plugin.
    // Leaving this empty is correct unless you have specific native Android dependencies.
}
